<svg width="100%" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="decorative animated footer banner">
  <defs>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EBDCFF"/>
      <stop offset="50%" stop-color="#FFD6EA"/>
      <stop offset="100%" stop-color="#EBDCFF"/>
    </linearGradient>
    <filter id="footGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="fPetal" d="M0,0 C5,-8 15,-8 18,0 C15,8 5,8 0,0 Z" fill="#FF8FC7"/>
  </defs>

  <rect width="1200" height="150" fill="url(#footGrad)"/>

  <text x="600" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#8A6A8F" filter="url(#footGlow)">
    ✧ thank you for visiting my little corner of the internet ✧
  </text>
  <text x="600" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="2" fill="#B191C9">
    made with sparkles, coffee, and carnatic music
  </text>

  <g>
    <use href="#fPetal" opacity="0.85">
      <animateMotion path="M60,-10 C100,40 20,70 60,120 C90,150 40,170 70,190" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="4s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#fPetal" opacity="0.8">
      <animateMotion path="M1140,-15 C1180,35 1100,65 1140,115 C1170,145 1120,165 1150,185" dur="10s" begin="1.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="4.6s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#fPetal" opacity="0.75">
      <animateMotion path="M300,-10 C340,40 260,70 300,120 C330,150 280,170 310,190" dur="11s" begin="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="5s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
</svg>
