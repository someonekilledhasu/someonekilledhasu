<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="animated pixel bunny companion">
  <defs>
    <radialGradient id="petShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EBDCFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EBDCFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="70" cy="118" rx="34" ry="8" fill="url(#petShadow)">
    <animate attributeName="rx" values="34;28;34" dur="2.6s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="2.6s" repeatCount="indefinite"/>

    <!-- ears -->
    <g transform="translate(52,30) rotate(-8)">
      <ellipse cx="0" cy="0" rx="8" ry="26" fill="#FFD6EA"/>
      <ellipse cx="0" cy="2" rx="4" ry="18" fill="#FFF0F8"/>
      <animateTransform attributeName="transform" type="rotate" values="-8;-16;-8" dur="3.2s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g transform="translate(88,30) rotate(8)">
      <ellipse cx="0" cy="0" rx="8" ry="26" fill="#FFD6EA"/>
      <ellipse cx="0" cy="2" rx="4" ry="18" fill="#FFF0F8"/>
      <animateTransform attributeName="transform" type="rotate" values="8;18;8" dur="3.2s" begin="0.3s" repeatCount="indefinite" additive="sum"/>
    </g>

    <!-- body -->
    <ellipse cx="70" cy="88" rx="38" ry="30" fill="#FFEAF5" stroke="#FFC1DD" stroke-width="2"/>

    <!-- head -->
    <circle cx="70" cy="62" r="30" fill="#FFF6FB" stroke="#FFC1DD" stroke-width="2"/>

    <!-- cheeks -->
    <circle cx="54" cy="68" r="5" fill="#FFC1DD" opacity="0.7"/>
    <circle cx="86" cy="68" r="5" fill="#FFC1DD" opacity="0.7"/>

    <!-- eyes (blinking) -->
    <g fill="#8A6A8F">
      <ellipse cx="61" cy="60" rx="3" ry="5">
        <animate attributeName="ry" values="5;5;0.5;5;5" keyTimes="0;0.85;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="79" cy="60" rx="3" ry="5">
        <animate attributeName="ry" values="5;5;0.5;5;5" keyTimes="0;0.85;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- nose + mouth -->
    <path d="M67,68 Q70,71 73,68" stroke="#E88CB8" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <circle cx="70" cy="65" r="1.6" fill="#E88CB8"/>

    <!-- tiny bow -->
    <g transform="translate(70,34)">
      <path d="M0,0 L-9,-6 L-9,6 Z" fill="#FF8FC7"/>
      <path d="M0,0 L9,-6 L9,6 Z" fill="#FF8FC7"/>
      <circle cx="0" cy="0" r="3" fill="#FFA6CF"/>
    </g>
  </g>
</svg>
