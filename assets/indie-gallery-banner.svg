<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hasini Thota</title>
  <desc id="desc">A chic indie tech banner with muted fluid ribbons and a centered name card.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#687c79"/>
      <stop offset="46%" stop-color="#46575c"/>
      <stop offset="100%" stop-color="#252b2d"/>
    </linearGradient>
    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b97970" stop-opacity="0"/>
      <stop offset="42%" stop-color="#b97970" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#d2a64e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5f668d" stop-opacity="0"/>
      <stop offset="48%" stop-color="#5f668d" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#ead8ad" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#171b1c" flood-opacity="0.44"/>
    </filter>
    <pattern id="grain" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="10" r="0.9" fill="#ead8ad" opacity="0.12"/>
      <circle cx="29" cy="24" r="1" fill="#171b1c" opacity="0.15"/>
      <path d="M0 37 H38" stroke="#171b1c" stroke-width="0.45" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="24" fill="url(#wall)"/>
  <rect width="1200" height="330" rx="24" fill="url(#grain)"/>

  <path d="M-80 92 C180 34 310 146 520 92 C760 30 900 80 1280 20" fill="none" stroke="url(#ribbonA)" stroke-width="28" stroke-linecap="round" opacity="0.72">
    <animate attributeName="d" values="M-80 92 C180 34 310 146 520 92 C760 30 900 80 1280 20;M-80 104 C170 48 322 122 530 98 C760 68 920 54 1280 34;M-80 92 C180 34 310 146 520 92 C760 30 900 80 1280 20" dur="10s" repeatCount="indefinite"/>
  </path>
  <path d="M-60 262 C230 205 358 282 574 240 C760 204 918 236 1260 176" fill="none" stroke="url(#ribbonB)" stroke-width="24" stroke-linecap="round" opacity="0.68">
    <animate attributeName="d" values="M-60 262 C230 205 358 282 574 240 C760 204 918 236 1260 176;M-60 246 C214 228 370 258 568 226 C776 192 930 214 1260 190;M-60 262 C230 205 358 282 574 240 C760 204 918 236 1260 176" dur="11s" repeatCount="indefinite"/>
  </path>

  <g opacity="0.65">
    <path d="M126 102 H220 V144 H300" fill="none" stroke="#ead8ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M1060 210 H976 V170 H900" fill="none" stroke="#d2a64e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" values="0;36" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="126" cy="102" r="5" fill="#b97970"/>
    <circle cx="300" cy="144" r="5" fill="#d2a64e"/>
    <circle cx="1060" cy="210" r="5" fill="#5f668d"/>
    <circle cx="900" cy="170" r="5" fill="#ead8ad"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="318" y="86" width="564" height="158" rx="18" fill="#202526" opacity="0.9"/>
    <rect x="337" y="104" width="526" height="122" rx="12" fill="#ead8ad"/>
    <path d="M380 130 H820" stroke="#b97970" stroke-width="2.5" stroke-linecap="round" opacity="0.72"/>
    <text x="600" y="168" text-anchor="middle" font-family="'Cormorant Garamond','Playfair Display',Georgia,serif" font-size="60" fill="#202526">Hasini Thota</text>
    <text x="600" y="196" text-anchor="middle" font-family="Inter,Verdana,sans-serif" font-size="13" letter-spacing="3" fill="#46575c">AI / DATA / PRODUCT</text>
  </g>

  <g font-family="Inter,Verdana,sans-serif" font-size="12" font-weight="700" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(92 188) rotate(-3)">
      <rect width="96" height="54" rx="8" fill="#202526"/>
      <rect x="10" y="10" width="76" height="34" rx="5" fill="#d2a64e"/>
      <text x="48" y="32" fill="#202526">BUILD</text>
    </g>
    <g transform="translate(1002 72) rotate(3)">
      <rect width="96" height="54" rx="8" fill="#202526"/>
      <rect x="10" y="10" width="76" height="34" rx="5" fill="#b97970"/>
      <text x="48" y="32" fill="#ead8ad">SHIP</text>
    </g>
  </g>
</svg>
