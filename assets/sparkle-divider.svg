<svg width="1200" height="64" viewBox="0 0 1200 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sparkle divider</title>
  <desc id="desc">Animated pink divider with a central bow and twinkling dots.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd6ea" stop-opacity="0"/>
      <stop offset="18%" stop-color="#ffb6d9" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ff5fbf"/>
      <stop offset="82%" stop-color="#ffb6d9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd6ea" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="spark" d="M0 -9 L2 -2 L9 0 L2 2 L0 9 L-2 2 L-9 0 L-2 -2 Z"/>
  </defs>

  <line x1="0" y1="32" x2="1200" y2="32" stroke="url(#line)" stroke-width="2"/>
  <line x1="180" y1="38" x2="1020" y2="38" stroke="#ffffff" stroke-width="1" opacity="0.85"/>

  <g filter="url(#glow)">
    <circle cx="600" cy="32" r="5" fill="#ffffff"/>
    <circle cx="600" cy="32" r="5" fill="#ff8fc7">
      <animate attributeName="r" values="4;8;4" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <path d="M589 32 C560 14 548 16 544 32 C548 48 560 50 589 32 Z" fill="#ffd6ea" stroke="#ff8fc7" stroke-width="1.4"/>
    <path d="M611 32 C640 14 652 16 656 32 C652 48 640 50 611 32 Z" fill="#ffd6ea" stroke="#ff8fc7" stroke-width="1.4"/>
    <circle cx="600" cy="32" r="7" fill="#ff5fbf"/>
  </g>

  <g fill="#ffffff" filter="url(#glow)">
    <use href="#spark" x="120" y="32">
      <animate attributeName="opacity" values="0.16;1;0.16" dur="2.1s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" x="255" y="32" transform="scale(0.72)">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" x="430" y="32" transform="scale(0.55)">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.2s" begin="1s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" x="770" y="32" transform="scale(0.55)">
      <animate attributeName="opacity" values="0.18;0.9;0.18" dur="2.4s" begin="0.7s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" x="945" y="32" transform="scale(0.72)">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" begin="1.2s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" x="1080" y="32">
      <animate attributeName="opacity" values="0.16;1;0.16" dur="2.1s" begin="0.3s" repeatCount="indefinite"/>
    </use>
  </g>

  <circle cx="0" cy="32" r="3" fill="#ff5fbf" filter="url(#glow)">
    <animateMotion path="M190 0 H1010 H190" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
