<svg width="1000" height="270" viewBox="0 0 1000 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Love letter console</title>
  <desc id="desc">Animated profile card describing Hasini's studies, projects, and interests.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffafb"/>
      <stop offset="55%" stop-color="#fff0f8"/>
      <stop offset="100%" stop-color="#fff7d7"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8fc7"/>
      <stop offset="100%" stop-color="#b78cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#ff8fc7" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="spark" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/>
  </defs>

  <rect x="28" y="26" width="944" height="218" rx="34" fill="url(#paper)" stroke="#ffd6ea" stroke-width="2" filter="url(#shadow)"/>
  <rect x="56" y="54" width="888" height="162" rx="24" fill="#ffffff" opacity="0.56" stroke="#ffffff"/>

  <g transform="translate(78 72)">
    <circle cx="38" cy="38" r="34" fill="url(#seal)" opacity="0.94"/>
    <path d="M38 54 C7 33 19 12 38 25 C57 12 69 33 38 54 Z" fill="#ffffff" opacity="0.92"/>
    <circle cx="38" cy="38" r="39" fill="none" stroke="#ff8fc7" stroke-width="2" opacity="0.48">
      <animate attributeName="r" values="38;45;38" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.48;0.1;0.48" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Poppins, Verdana, sans-serif" fill="#7c5a72">
    <text x="166" y="88" font-size="15" fill="#b78cff">new profile note opened</text>
    <text x="166" y="126" font-size="34" font-weight="700" fill="#ff5fbf">hi, I'm Hasini</text>
    <text x="166" y="162" font-size="18">AI &amp; Data Science student building cute, useful, live apps.</text>
    <text x="166" y="192" font-size="18">Usually found near hackathons, Carnatic music, MUN prep, or a tiny pink deploy button.</text>
  </g>

  <g transform="translate(742 76)" font-family="Poppins, Verdana, sans-serif">
    <rect x="0" y="0" width="168" height="112" rx="22" fill="#fff5fb" stroke="#ffd6ea"/>
    <text x="84" y="34" text-anchor="middle" font-size="13" fill="#b78cff">current quest</text>
    <text x="84" y="68" text-anchor="middle" font-size="21" font-weight="700" fill="#ff5fbf">ship magic</text>
    <text x="84" y="94" text-anchor="middle" font-size="12" fill="#7c5a72">with clean commits</text>
  </g>

  <g fill="#ffffff" filter="url(#glow)">
    <use href="#spark" x="78" y="42">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" x="908" y="46" transform="scale(0.8)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin="0.7s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" x="864" y="226" transform="scale(0.7)">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </use>
  </g>

  <rect x="664" y="150" width="12" height="28" rx="4" fill="#ff8fc7">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
