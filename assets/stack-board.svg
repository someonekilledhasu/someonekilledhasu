<svg width="1000" height="270" viewBox="0 0 1000 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tech stack board</title>
  <desc id="desc">A muted framed poster board listing Hasini's technology stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe4c7"/>
      <stop offset="100%" stop-color="#d8d1bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#1f2425" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="28" y="24" width="944" height="208" rx="22" fill="#2f3334" filter="url(#shadow)"/>
  <rect x="52" y="46" width="896" height="164" rx="12" fill="url(#bg)"/>
  <text x="96" y="91" font-family="Georgia, serif" font-size="34" fill="#2f3334">stack, in rotation</text>
  <text x="96" y="122" font-family="Inter, Verdana, sans-serif" font-size="16" fill="#52636a">small tools, real outputs, clean handoff</text>

  <g font-family="Inter, Verdana, sans-serif" font-size="15" font-weight="700">
    <g transform="translate(96 152)">
