    <g transform="translate(364 152)">
      <rect width="128" height="34" rx="5" fill="#57648c"/>
      <text x="64" y="22" text-anchor="middle" fill="#efe4c7">TypeScript</text>
    </g>
    <g transform="translate(508 152)">
      <rect width="98" height="34" rx="5" fill="#a94b3b"/>
      <text x="49" y="22" text-anchor="middle" fill="#efe4c7">React</text>
    </g>
    <g transform="translate(622 152)">
      <rect width="106" height="34" rx="5" fill="#4b3b32"/>
      <text x="53" y="22" text-anchor="middle" fill="#efe4c7">Node.js</text>
