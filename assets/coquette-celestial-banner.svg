<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hasini Thota</title>
  <desc id="desc">Animated pink celestial profile banner with orbiting sparkles and ribbon details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6fb"/>
      <stop offset="34%" stop-color="#ffd6ea"/>
      <stop offset="68%" stop-color="#f7d7ff"/>
      <stop offset="100%" stop-color="#ffeec8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="48%" stop-color="#ffd1e8" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#ffd1e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8fc7"/>
      <stop offset="50%" stop-color="#ff5fbf"/>
      <stop offset="100%" stop-color="#b78cff"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#ff8fc7" flood-opacity="0.38"/>
    </filter>
    <path id="sparkle" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>
    <path id="miniHeart" d="M0 9 C-18 -4 -13 -22 0 -14 C13 -22 18 -4 0 9 Z"/>
    <path id="petal" d="M0 0 C8 -14 25 -14 31 0 C25 14 8 14 0 0 Z"/>
    <pattern id="dotGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#ffffff" opacity="0.42"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="28" fill="url(#dotGrid)" opacity="0.85"/>

  <circle cx="600" cy="158" r="190" fill="url(#halo)">
    <animate attributeName="r" values="172;205;172" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.68;1;0.68" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.75">
    <circle cx="126" cy="82" r="48" fill="#ffffff" opacity="0.42">
      <animateTransform attributeName="transform" type="translate" values="0 0;22 -4;0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1034" cy="78" r="62" fill="#ffffff" opacity="0.34">
      <animateTransform attributeName="transform" type="translate" values="0 0;-28 7;0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1048" cy="254" r="54" fill="#fff5cf" opacity="0.28">
      <animateTransform attributeName="transform" type="translate" values="0 0;-20 -8;0 0" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(600 158)" opacity="0.72">
    <ellipse rx="330" ry="88" fill="none" stroke="#ffffff" stroke-width="2"/>
    <ellipse rx="252" ry="64" fill="none" stroke="#ff8fc7" stroke-width="1.5" opacity="0.68" transform="rotate(-8)"/>
    <ellipse rx="388" ry="102" fill="none" stroke="#b78cff" stroke-width="1" opacity="0.45" transform="rotate(8)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <use href="#sparkle" x="330" y="0" fill="#ffffff" filter="url(#softGlow)"/>
      <use href="#miniHeart" x="-330" y="0" fill="#ff5fbf" transform="scale(0.85)" filter="url(#softGlow)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="23s" repeatCount="indefinite"/>
      <circle cx="0" cy="-88" r="8" fill="#fff5cf" filter="url(#softGlow)"/>
      <use href="#petal" x="0" y="88" fill="#ffb6d9" transform="scale(0.55) rotate(26)" filter="url(#softGlow)"/>
    </g>
  </g>

  <g fill="#ffffff" filter="url(#softGlow)">
    <use href="#sparkle" x="92" y="54">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/>
    </use>
    <use href="#sparkle" x="230" y="260" transform="scale(0.75)">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.3s" begin="0.5s" repeatCount="indefinite"/>
    </use>
    <use href="#sparkle" x="970" y="55" transform="scale(0.88)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    </use>
    <use href="#sparkle" x="1118" y="236" transform="scale(0.72)">
      <animate attributeName="opacity" values="0.12;0.9;0.12" dur="3s" begin="1.1s" repeatCount="indefinite"/>
    </use>
  </g>

  <g opacity="0.88">
    <use href="#petal" x="158" y="-20" fill="#ffb6d9" transform="rotate(24)">
      <animateMotion path="M0 0 C52 70 -18 148 42 230 C80 282 34 330 54 365" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="5s" additive="sum" repeatCount="indefinite"/>
    </use>
    <use href="#petal" x="822" y="-28" fill="#ff8fc7" transform="rotate(-18)">
      <animateMotion path="M0 0 C58 80 -44 146 24 224 C78 286 18 326 48 365" dur="12s" begin="1.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="6s" additive="sum" repeatCount="indefinite"/>
    </use>
    <use href="#petal" x="1050" y="-34" fill="#f7b8ff" transform="rotate(8)">
      <animateMotion path="M0 0 C48 66 -28 140 32 214 C88 282 28 330 62 365" dur="11s" begin="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="5.6s" additive="sum" repeatCount="indefinite"/>
    </use>
  </g>

  <g filter="url(#dropGlow)">
    <rect x="326" y="78" width="548" height="162" rx="32" fill="#ffffff" opacity="0.42"/>
    <rect x="342" y="94" width="516" height="130" rx="26" fill="#fffafd" opacity="0.66" stroke="#ffffff" stroke-width="1.5"/>
    <text x="600" y="154" text-anchor="middle" font-family="'Segoe Script','Brush Script MT','Lucida Handwriting',cursive" font-size="70" fill="#ff5fbf">
      Hasini Thota
      <animate attributeName="fill" values="#ff5fbf;#b78cff;#ff8fc7;#ff5fbf" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="194" text-anchor="middle" font-family="Poppins, Verdana, sans-serif" font-size="18" fill="#7c5a72">
      she codes in pink starlight
    </text>
  </g>

  <g transform="translate(600 254)">
    <path d="M-170 0 C-112 -24 -56 -24 0 0 C56 24 112 24 170 0" fill="none" stroke="url(#ribbon)" stroke-width="5" stroke-linecap="round" opacity="0.9">
      <animate attributeName="stroke-width" values="4;6;4" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#ff8fc7" stroke-width="3"/>
  </g>
</svg>
