<svg width="1200" height="54" viewBox="0 0 1200 54" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Indie divider</title>
  <desc id="desc">A minimal animated divider with muted poster colors.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#52636a" stop-opacity="0"/>
      <stop offset="25%" stop-color="#52636a"/>
      <stop offset="50%" stop-color="#d7a847"/>
      <stop offset="75%" stop-color="#a94b3b"/>
      <stop offset="100%" stop-color="#52636a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="70" y1="27" x2="1130" y2="27" stroke="url(#line)" stroke-width="2"/>
  <g>
    <rect x="542" y="18" width="28" height="18" rx="2" fill="#2f3334"/>
    <rect x="575" y="18" width="28" height="18" rx="2" fill="#d7a847"/>
    <rect x="608" y="18" width="28" height="18" rx="2" fill="#a94b3b"/>
    <rect x="641" y="18" width="28" height="18" rx="2" fill="#57648c"/>
  </g>
  <circle cx="70" cy="27" r="3" fill="#efe4c7">
    <animateMotion path="M0 0 H1060 H0" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>
