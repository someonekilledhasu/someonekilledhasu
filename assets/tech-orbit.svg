<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tech orbit</title>
  <desc id="desc">Animated pink and pastel tech stack orbit with labels for languages, frameworks, tools, and databases.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffafb"/>
      <stop offset="58%" stop-color="#fff0f8"/>
      <stop offset="100%" stop-color="#eefaf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#ff8fc7" flood-opacity="0.18"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="spark" d="M0 -7 L1.8 -1.8 L7 0 L1.8 1.8 L0 7 L-1.8 1.8 L-7 0 L-1.8 -1.8 Z"/>
  </defs>

  <rect x="26" y="24" width="948" height="242" rx="34" fill="url(#card)" stroke="#ffd6ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="70" text-anchor="middle" font-family="Poppins, Verdana, sans-serif" font-size="28" font-weight="700" fill="#ff5fbf">tiny toolbox universe</text>
  <text x="500" y="99" text-anchor="middle" font-family="Poppins, Verdana, sans-serif" font-size="14" fill="#7c5a72">the stack that helps the pretty ideas become real things</text>

  <g transform="translate(500 172)">
    <ellipse rx="320" ry="70" fill="none" stroke="#ffd6ea" stroke-width="2"/>
    <ellipse rx="248" ry="52" fill="none" stroke="#b78cff" stroke-width="1.5" opacity="0.52" transform="rotate(-8)"/>
    <ellipse rx="158" ry="34" fill="none" stroke="#9adbbd" stroke-width="1.5" opacity="0.56" transform="rotate(8)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="26s" repeatCount="indefinite"/>
      <circle cx="320" cy="0" r="7" fill="#ff8fc7" filter="url(#glow)"/>
      <circle cx="-320" cy="0" r="7" fill="#fff5cf" filter="url(#glow)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="31s" repeatCount="indefinite"/>
      <circle cx="0" cy="-70" r="7" fill="#b78cff" filter="url(#glow)"/>
      <circle cx="0" cy="70" r="7" fill="#9adbbd" filter="url(#glow)"/>
    </g>
  </g>

  <g font-family="Poppins, Verdana, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <g transform="translate(132 142)">
      <rect x="-60" y="-22" width="120" height="44" rx="16" fill="#ffd6ea" stroke="#ffffff"/>
      <text y="5" fill="#7c4d72">Python</text>
    </g>
    <g transform="translate(284 218)">
      <rect x="-64" y="-22" width="128" height="44" rx="16" fill="#f7d7ff" stroke="#ffffff"/>
      <text y="5" fill="#765a91">React</text>
    </g>
    <g transform="translate(412 140)">
      <rect x="-74" y="-22" width="148" height="44" rx="16" fill="#fff5cf" stroke="#ffffff"/>
      <text y="5" fill="#8a6a4b">Next.js</text>
    </g>
    <g transform="translate(586 218)">
      <rect x="-72" y="-22" width="144" height="44" rx="16" fill="#dff7ec" stroke="#ffffff"/>
      <text y="5" fill="#4f806a">Node.js</text>
    </g>
    <g transform="translate(714 140)">
      <rect x="-82" y="-22" width="164" height="44" rx="16" fill="#ffb6d9" stroke="#ffffff"/>
      <text y="5" fill="#7c4d72">Supabase</text>
    </g>
    <g transform="translate(868 218)">
      <rect x="-78" y="-22" width="156" height="44" rx="16" fill="#ffd6ea" stroke="#ffffff"/>
      <text y="5" fill="#7c4d72">MongoDB</text>
    </g>
  </g>

  <g fill="#ffffff" filter="url(#glow)">
    <use href="#spark" x="96" y="76">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.7s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" x="884" y="72" transform="scale(0.85)">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" x="520" y="250" transform="scale(0.7)">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.9s" begin="1.1s" repeatCount="indefinite"/>
    </use>
  </g>
</svg>
