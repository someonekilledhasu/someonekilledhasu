<svg width="1000" height="245" viewBox="0 0 1000 245" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">About Hasini</title>
  <desc id="desc">A clean indie wall board describing Hasini's profile.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#52636a"/>
      <stop offset="100%" stop-color="#3d464a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#1f2425" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect x="26" y="24" width="948" height="190" rx="22" fill="url(#wall)" filter="url(#shadow)"/>
  <rect x="58" y="50" width="282" height="138" rx="8" fill="#2f3334"/>
  <rect x="72" y="64" width="254" height="110" rx="4" fill="#efe4c7"/>
  <text x="94" y="104" font-family="Georgia, serif" font-size="30" fill="#2f3334">currently</text>
  <text x="94" y="138" font-family="Inter, Verdana, sans-serif" font-size="17" fill="#52636a">turning ideas into</text>
  <text x="94" y="161" font-family="Inter, Verdana, sans-serif" font-size="17" fill="#52636a">working product experiments</text>

  <g font-family="Inter, Verdana, sans-serif">
    <text x="392" y="84" font-size="13" letter-spacing="2" fill="#d7a847">ABOUT</text>
    <text x="392" y="122" font-size="31" font-weight="700" fill="#efe4c7">AI + Data Science student</text>
    <text x="392" y="157" font-size="18" fill="#d8d1bf">I like systems that are useful, calm, and finished well.</text>
    <text x="392" y="186" font-size="18" fill="#d8d1bf">My sweet spot is practical AI, clean interfaces, and shipping the idea.</text>
  </g>

  <g transform="translate(860 72)">
    <rect width="64" height="82" rx="5" fill="#2f3334"/>
    <rect x="8" y="8" width="48" height="66" rx="2" fill="#a94b3b"/>
    <path d="M20 53 L32 27 L44 53 Z" fill="#efe4c7"/>
    <circle cx="32" cy="29" r="5" fill="#d7a847">
      <animate attributeName="cy" values="29;25;29" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
