<svg width="100%" height="46" viewBox="0 0 1200 46" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="decorative sakura divider">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD6EA" stop-opacity="0"/>
      <stop offset="15%" stop-color="#FFA6CF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FF8FC7" stop-opacity="1"/>
      <stop offset="85%" stop-color="#FFA6CF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFD6EA" stop-opacity="0"/>
    </linearGradient>
    <path id="miniPetal" d="M0,0 C4,-6 11,-6 14,0 C11,6 4,6 0,0 Z" fill="#FF8FC7"/>
  </defs>

  <line x1="0" y1="23" x2="1200" y2="23" stroke="url(#lineGrad)" stroke-width="1.5"/>

  <g>
    <circle cx="600" cy="23" r="4" fill="#FFFFFF"/>
    <circle cx="600" cy="23" r="4" fill="#FFA6CF">
      <animate attributeName="r" values="3;6;3" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(560,23) rotate(-20)">
    <use href="#miniPetal">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
    </use>
  </g>
  <g transform="translate(654,23) rotate(40)">
    <use href="#miniPetal">
      <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="7s" repeatCount="indefinite"/>
    </use>
  </g>

  <g fill="#FFFFFF">
    <circle cx="120" cy="23" r="2.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="23" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="23" r="2.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="23" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
